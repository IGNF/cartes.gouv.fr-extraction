server {
    listen       8080;
    server_name  localhost;
    root /usr/share/nginx/html;

    # Redirection pour ajouter un slash final si nécessaire
    location = /extraire-une-donnee {
        # Conserve les query params (code/state/session_state) du callback OAuth lors de la redirection vers /extraire-une-donnee/
        # URL relative pour conserver le protocole public (HTTPS derrière l'ingress).
        return 301 /extraire-une-donnee/$is_args$args;
    }

    # Le tableau de bord est servi à la racine du domaine, hors de l'application d'extraction.
    location ~ ^/extraire-une-donnee/tableau-de-bord/?$ {
        # Ne pas utiliser $scheme : nginx voit HTTP entre l'ingress TLS et le conteneur.
        return 301 /tableau-de-bord$is_args$args;
    }

    # L'application est buildée avec base=/extraire-une-donnee/ :
    location /extraire-une-donnee/ {
        try_files $uri $uri/ /extraire-une-donnee/index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}