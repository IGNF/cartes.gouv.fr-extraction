server {
    listen       8080;
    server_name  localhost;
    root /usr/share/nginx/html;

    # Redirection pour ajouter un slash final si nécessaire
    location = /extraire-une-donnee {
        # Conserve les query params (code/state/session_state) du callback OAuth lors de la redirection vers /extraire-une-donnee/
        # Utilise $http_host (header Host du client) plutôt que $host:$server_port
        # pour éviter que nginx ajoute le port interne 8080 dans l'URL de redirection.
        return 301 $scheme://$http_host/extraire-une-donnee/$is_args$args;
    }

    # L'application est buildée avec base=/extraire-une-donnee/ :
    location /extraire-une-donnee/ {
        try_files $uri $uri/ /extraire-une-donnee/index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}