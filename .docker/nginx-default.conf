server {
    listen       8080;
    server_name  localhost;
    root /usr/share/nginx/html;

    # Redirection pour ajouter un slash final si nécessaire
    location = /extraction {
        # Conserve les query params (code/state/session_state) du callback OAuth lors de la redirection vers /extraction/
        return 301 /extraction/$is_args$args;
    }

    # L'application est buildée avec base=/extraction :
    location /extraction/ {
        try_files $uri $uri/ /extraction/index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}