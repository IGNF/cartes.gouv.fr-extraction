server {
    listen       8080;
    server_name  localhost;
    root /usr/share/nginx/html;

    # Redirection pour ajouter un slash final si nécessaire
    location = /extraction {
        return 301 /extraction/;
    }

    # L'application est buildée avec base=/extraction :
    location /extraction/ {
        # Sert les fichiers réels sous /usr/share/nginx/html/extraction
        # et garde un fallback SPA sur /extraction/index.html
        try_files $uri $uri/ /extraction/index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
    location = / {
        # Redirige uniquement la racine exacte vers le point d'entrée de l'application
        return 302 /extraction/;
    }

    location / {
        # Ne capture pas les autres chemins : évite d'impacter d'autres applicatifs
        return 404;
    }
}